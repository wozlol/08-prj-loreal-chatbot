<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal Beauty Advisor</title>
    <meta
      name="description"
      content="A chatbot that recommends L'Oréal products and builds beauty routines."
    />

    <!-- Favicon -->
    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />

    <!-- Open Graph (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="L'Oréal Beauty Advisor" />
    <meta
      property="og:description"
      content="A chatbot that recommends L'Oréal products and builds beauty routines."
    />
    <meta
      property="og:url"
      content="https://wozlol.github.io/08-prj-loreal-chatbot/"
    />
    <meta
      property="og:image"
      content="https://wozlol.github.io/08-prj-loreal-chatbot/img/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="L'Oréal Beauty Advisor on a cream background with a gold accent"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <img
          src="img/loreal-logo.png"
          alt="L'Oréal Paris"
          class="site-logo"
        />
        <h1 class="site-title">Beauty Advisor</h1>
        <p class="site-tagline">
          Makeup, skincare, haircare and fragrance, picked for you.
        </p>
      </header>

      <!------- Chat Area ------->
      <main>
        <section class="chatbox">
          <!-- Saved chats as tabs, drawn by script.js -->
          <div id="chatTabs" class="chat-tabs"></div>

          <!-- Shows the latest question just above the answer -->
          <div id="latestQuestion" class="latest-question" hidden></div>

          <div
            id="chatWindow"
            class="chat-window"
            aria-live="polite"
          >
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
          <p class="save-note">
            Chats are saved on this device only. Use × on a tab to delete it.
          </p>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>
          &copy; 2026 By
          <a href="https://woz.lol" target="_blank" rel="noopener">woz.lol</a>
          for
          <a href="https://www.loreal.com" target="_blank" rel="noopener"
            >L'Oréal</a
          >
        </p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
